<script>
let paused=false,boosted=false,toastTimer;
const root=document.documentElement,statusText=document.getElementById('status');
function updateStatus(){statusText.textContent=paused?'云端小憩，马上回来':boosted?'火力全开，热乎加速中！':'情绪稳定，正在飞行'}
document.getElementById('pause').addEventListener('click',()=>{paused=!paused;root.style.setProperty('--play',paused?'paused':'running');document.getElementById('pause-label').textContent=paused?'继续出发':'歇一小会';document.getElementById('pause-icon').textContent=paused?'▷':'Ⅱ';document.getElementById('pause').setAttribute('aria-pressed',String(paused));updateStatus()});
document.getElementById('speed').addEventListener('click',()=>{boosted=!boosted;root.style.setProperty('--speed',boosted?'2.5':'1');document.body.classList.toggle('boost',boosted);document.getElementById('speed-label').textContent=boosted?'恢复慢悠悠':'加急一下';document.getElementById('speed').setAttribute('aria-pressed',String(boosted));updateStatus()});
document.getElementById('cheer').addEventListener('click',()=>{const toast=document.getElementById('toast');toast.classList.add('show');document.getElementById('cheer').textContent='♥';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.classList.remove('show');document.getElementById('cheer').textContent='♡'},2600)});
</script>
