<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152d3b">
  <title>云端急送 - 水豚火箭快递</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #152d3b;
      color: #f7f3e8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    body {
      min-width: 320px;
      background:
        radial-gradient(ellipse at 48% 45%, rgba(62, 112, 116, .28), transparent 50%),
        #152d3b;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 520px;
      isolation: isolate;
      overflow: hidden;
    }

    .art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: absolute;
      z-index: 2;
      inset: 28px 34px auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: rgba(20, 43, 53, .48);
      color: #f4bd59;
      box-shadow: 0 8px 24px rgba(8, 25, 34, .15);
    }

    .brand-mark svg { width: 21px; height: 21px; }
    .brand-name { font-size: 13px; font-weight: 800; letter-spacing: 0; }
    .brand-sub { margin-top: 3px; color: #a9c1bc; font-size: 10px; font-weight: 600; }

    .flight-state {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      border: 1px solid rgba(229, 241, 221, .17);
      border-radius: 99px;
      background: rgba(20, 43, 53, .45);
      color: #d6e2d9;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0;
      backdrop-filter: blur(10px);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f4bd59;
      box-shadow: 0 0 12px rgba(244,189,89,.75);
      animation: pulse 1.7s ease-in-out infinite;
    }

    .delivery-card {
      position: absolute;
      z-index: 2;
      left: clamp(20px, 5vw, 78px);
      bottom: clamp(26px, 6vh, 58px);
      width: min(290px, calc(100vw - 40px));
      padding: 17px 18px 16px;
      border: 1px solid rgba(231, 240, 221, .14);
      border-radius: 8px;
      background: rgba(20, 43, 53, .62);
      box-shadow: 0 18px 48px rgba(7, 24, 33, .2);
      backdrop-filter: blur(14px);
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #a9c1bc;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .order-number { color: #f4bd59; }
    .destination { margin-top: 8px; font-size: 19px; font-weight: 800; }
    .recipient { margin-top: 4px; color: #b6c8c1; font-size: 11px; }

    .route {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      color: #dfe8df;
      font-size: 10px;
      font-weight: 700;
    }

    .route-line {
      position: relative;
      flex: 1;
      height: 1px;
      background: rgba(213, 231, 211, .25);
    }

    .route-line::after {
      position: absolute;
      top: -2px;
      left: 72%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #f4bd59;
      content: "";
      box-shadow: 0 0 10px rgba(244,189,89,.8);
      animation: travel-dot 3.5s linear infinite;
    }

    .control {
      position: absolute;
      z-index: 3;
      right: 34px;
      bottom: 38px;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(231, 240, 221, .23);
      border-radius: 50%;
      background: rgba(20, 43, 53, .65);
      color: #f7f3e8;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
      backdrop-filter: blur(10px);
    }

    .control:hover { transform: translateY(-2px); background: rgba(48, 78, 83, .9); }
    .control:focus-visible { outline: 2px solid #f4bd59; outline-offset: 3px; }
    .control svg { width: 17px; height: 17px; }
    .play-icon { display: none; }

    .paused .motion,
    .paused .flame,
    .paused .spark,
    .paused .live-dot,
    .paused .route-line::after {
      animation-play-state: paused !important;
    }

    .paused .pause-icon { display: none; }
    .paused .play-icon { display: block; }

    .motion { animation: flight 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flame { transform-box: fill-box; transform-origin: 0% 50%; animation: flame 160ms ease-in-out infinite alternate; }
    .spark { animation: spark 1.4s ease-in-out infinite; }
    .spark.delay-1 { animation-delay: -.45s; }
    .spark.delay-2 { animation-delay: -.9s; }

    @keyframes flight {
      0%, 100% { transform: translate(0, 0) rotate(-1.2deg); }
      50% { transform: translate(8px, -17px) rotate(1deg); }
    }

    @keyframes flame {
      from { transform: scaleX(.8) scaleY(.88); opacity: .78; }
      to { transform: scaleX(1.12) scaleY(1.08); opacity: 1; }
    }

    @keyframes spark {
      0%, 100% { opacity: .15; transform: translateY(5px) scale(.7); }
      50% { opacity: .9; transform: translateY(-5px) scale(1); }
    }

    @keyframes pulse { 50% { opacity: .38; } }
    @keyframes travel-dot { to { left: 96%; } }

    @media (max-width: 620px) {
      .topbar { inset: 18px 18px auto; }
      .flight-state { padding: 9px 10px; font-size: 9px; }
      .delivery-card { bottom: 22px; padding: 14px 15px; width: 250px; }
      .destination { font-size: 17px; }
      .control { right: 18px; bottom: 26px; }
      .brand-sub { display: none; }
      .brand-name { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <script>
    const scene = document.getElementById("scene");
    const toggle = document.getElementById("motion-toggle");

    toggle.addEventListener("click", () => {
      const paused = scene.classList.toggle("paused");
      toggle.setAttribute("aria-pressed", String(paused));
      toggle.setAttribute("aria-label", paused ? "继续动画" : "暂停动画");
      toggle.setAttribute("title", paused ? "继续动画" : "暂停动画");
    });
  </script>
</body>
</html>
