<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202d4f">
  <title>水豚火箭外卖｜CAPY EXPRESS</title>
  <style>
    :root { color-scheme: dark; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #17213c; color: #fff; }
    main { width: min(1180px, 100%); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 900; letter-spacing: 3px; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: #ffca69; color: #253252; font-size: 22px; box-shadow: 0 6px 20px #0003; }
    .status { display: flex; align-items: center; gap: 8px; color: #c7d5ed; font-size: 12px; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #81e6ae; box-shadow: 0 0 12px #81e6ae; animation: statusPulse 1.6s infinite; }
    .stage { position: relative; overflow: hidden; border: 1px solid #ffffff20; border-radius: 28px; background: #efad89; box-shadow: 0 28px 80px #0006; }
    svg.scene { display: block; width: 100%; height: auto; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 4px 0; }
    .hint { color: #aebbd2; font-size: 12px; }
    .button-group { display: flex; gap: 10px; }
    button { appearance: none; border: 1px solid #ffffff24; border-radius: 12px; padding: 10px 18px; background: #ffffff10; color: #fff; font: 600 13px inherit; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: #ffffff20; transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid #ffcf70; outline-offset: 3px; }
    .paused .anim, .paused .anim * { animation-play-state: paused !important; }
    .paused .status::before { background: #ffca69; box-shadow: none; animation-play-state: paused; }
    .cloud-back { animation: cloudTravel 24s linear infinite; }
    .cloud-front { animation: cloudTravel 15s linear infinite; }
    .speed-lines { animation: speedTravel 2.6s linear infinite; }
    .rider { transform-origin: 570px 355px; animation: hover 2.5s ease-in-out infinite; }
    .flame { transform-origin: 322px 390px; animation: flameFlicker .14s ease-in-out infinite alternate; }
    .flame-core { transform-origin: 320px 390px; animation: flameFlicker .1s ease-in-out infinite alternate-reverse; }
    .spark { animation: sparkFly 1.1s linear infinite; }
    .spark.s2 { animation-delay: -.36s; }
    .spark.s3 { animation-delay: -.73s; }
    .spark.s4 { animation-delay: -.9s; }
    .scarf-tail { transform-origin: 474px 277px; animation: scarfWave .55s ease-in-out infinite alternate; }
    .ear { transform-origin: 525px 191px; animation: earWiggle 3.1s ease-in-out infinite; }
    .goggle-glint { animation: glint 3s ease-in-out infinite; }
    .bird { animation: birdBob 1.8s ease-in-out infinite alternate; }
    .star { animation: twinkle 2.2s ease-in-out infinite alternate; }
    .star:nth-child(2n) { animation-delay: -1s; }
    .city-far { animation: cityTravel 32s linear infinite; }
    .city-near { animation: cityTravel 20s linear infinite; }
    .road-dashes { animation: roadMove 1s linear infinite; }
    .delivery-beacon { animation: beacon 2s ease-out infinite; transform-origin: 1020px 330px; }
    .steam { animation: steamRise 2s ease-out infinite; }
    .steam.s2 { animation-delay: -.7s; }
    .steam.s3 { animation-delay: -1.4s; }
    @keyframes hover { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-18px) rotate(2deg); } }
    @keyframes flameFlicker { from { transform: scaleX(.82) scaleY(.9); opacity: .85; } to { transform: scaleX(1.12) scaleY(1.08); opacity: 1; } }
    @keyframes sparkFly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(-130px,22px) scale(.1); opacity: 0; } }
    @keyframes scarfWave { from { transform: rotate(-6deg) skewX(-4deg); } to { transform: rotate(9deg) skewX(5deg); } }
    @keyframes earWiggle { 0%,86%,100% { transform: rotate(0); } 90% { transform: rotate(-13deg); } 95% { transform: rotate(7deg); } }
    @keyframes glint { 0%,45%,100% { opacity: .25; transform: translateX(0); } 55% { opacity: .9; transform: translateX(5px); } }
    @keyframes cloudTravel { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
    @keyframes speedTravel { from { transform: translateX(0); opacity: 0; } 15% { opacity: .7; } 85% { opacity: .7; } to { transform: translateX(-1250px); opacity: 0; } }
    @keyframes cityTravel { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes roadMove { to { transform: translateX(-150px); } }
    @keyframes birdBob { to { transform: translateY(-8px); } }
    @keyframes twinkle { from { opacity: .2; } to { opacity: .85; } }
    @keyframes beacon { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes steamRise { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: .5; } 100% { transform: translateY(-30px); opacity: 0; } }
    @keyframes statusPulse { 50% { opacity: .35; } }
    @media (max-width: 650px) { body { padding: 12px; } .toolbar { margin-bottom: 10px; } .brand { font-size: 11px; letter-spacing: 1.5px; } .stage { border-radius: 18px; } .hint { display: none; } .controls { justify-content: flex-end; } }
    @media (prefers-reduced-motion: reduce) { .anim, .anim *, .status::before { animation-play-state: paused !important; } }
  </style>
</head>

    </div>
  </footer>
</main>
<script>
  const stage = document.getElementById('stage');
  const toggle = document.getElementById('toggle');
  const replay = document.getElementById('replay');
  const status = document.getElementById('status');
  let paused = false;

  function setPaused(value) {
    paused = value;
    stage.classList.toggle('paused', paused);
    toggle.textContent = paused ? '继续动画' : '暂停动画';
    toggle.setAttribute('aria-pressed', String(paused));
    status.textContent = paused ? '火箭悬停 · 已暂停' : '火箭专送 · 配送中';
  }

  toggle.addEventListener('click', () => setPaused(!paused));
  replay.addEventListener('click', () => {
    setPaused(false);
    stage.classList.remove('anim');
    void stage.offsetWidth;
    stage.classList.add('anim');
  });
</script>
</body>
</html>
